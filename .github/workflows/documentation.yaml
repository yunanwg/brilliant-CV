name: Deploy Documentation

# The site documents the released package, so it deploys only from a release
# tag: release-and-publish.yaml calls this workflow after the release passes
# every gate. Pull requests build the site without deploying it, so a broken
# page still fails before merge.
on:
  pull_request:
  workflow_call:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - uses: typst-community/setup-typst@40d32bb6ccb235bd7f5164cb47cfd40a5ea3a314 # v5
        with:
          typst-version: 0.14.0

      - name: Validate shipped metadata schema
        run: uv run --with-requirements scripts/requirements-checks.lock python scripts/check_metadata_schema.py

      - name: Generate and validate public documentation
        run: |
          python3 docs/web/generate-api-reference.py
          git diff --exit-code -- docs/web/docs/api-reference.md
          python3 scripts/check_docs_snippets.py

      - name: Copy component render refs
        run: |
          mkdir -p docs/web/docs/assets/components
          for dir in tests/components/*/; do
            name=$(basename "$dir")
            cp "$dir/ref/1.png" "docs/web/docs/assets/components/$name.png"
          done

      - name: Build strict MkDocs site from lockfile
        run: cd docs/web && uv run --with-requirements requirements.lock mkdocs build --strict --site-dir ../../public

      - name: Upload documentation site
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: documentation-site
          path: public/
          if-no-files-found: error
          retention-days: 1

      - name: Download documentation site for round-trip verification
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: documentation-site
          path: roundtrip-site

      - name: Verify documentation artifact contents
        run: test -s roundtrip-site/index.html

  deploy:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: documentation-site
          path: public

      - uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          force_orphan: true
