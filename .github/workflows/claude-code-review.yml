name: Claude Code Review

on:
  pull_request:
    # Review once when a PR opens or leaves draft. `synchronize` is intentionally
    # omitted so follow-up pushes don't re-run the review on every commit — tag
    # @claude manually if a later revision needs another pass.
    types: [opened, ready_for_review]
    # Only review changes to the published package and the user-facing template.
    # Docs-only / tests-only / CI-only PRs skip AI review, mirroring the repo
    # convention that such changes also skip regression tests.
    paths:
      - "src/**"
      - "template/**"

jobs:
  claude-review:
    # Fork PRs get no repository secrets, and the action refuses authors
    # without write access, so a run on a fork can only fail. Review
    # external contributions with an `@claude review` comment instead
    # (claude.yml), which runs in the base repository.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # post the review as PR comments
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history, so `git diff origin/main...HEAD` works for the review.
          fetch-depth: 0

      # Typst lets the reviewer check a claim by compiling a small probe
      # instead of guessing. Same pinned action and package symlink as
      # claude.yml.
      - name: Set up Typst
        uses: typst-community/setup-typst@fee4b65b091cc546f02ce3be15fad8760f38a108 # v5
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Link local package
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' typst.toml | head -1)
          dir="$HOME/.local/share/typst/packages/preview/brilliant-cv/$version"
          mkdir -p "$(dirname "$dir")"
          ln -sfn "$GITHUB_WORKSPACE" "$dir"

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@756cc22e19660d20e8cc9496b4f242475a7f7790 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # A plain prompt instead of the code-review plugin: the plugin's
          # first step lets a Haiku agent decide the PR needs no review and
          # stop silently (4 turns, no comment on #268). This prompt always
          # reviews and always leaves a summary comment.
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. The PR branch is checked out in the
            working directory; read AGENTS.md first, it is the contributor
            guide for this repository. Check the diff for:
            - bugs and regressions in src/ (the published package) and
              template/ (the starter users initialize);
            - breaking changes to public functions or metadata.toml fields
              without the migration path AGENTS.md requires;
            - missing regression tests, docs, or regenerated refs that
              AGENTS.md requires for the change.
            Report only concrete issues you can point to in the diff.

            Tools: read files with Read, Grep, and Glob; see the change with
            `gh pr diff <number>` or `git diff`, `git log`, and `git show`.
            To check how Typst behaves before you report it, write a small
            probe file with Write or Edit and compile it with
            `typst compile --root . <file> <out.pdf>`; report a behavior claim
            only if a probe or an existing test supports it. You can also run
            the repository's own checks: `bash tests/panics/run.sh`,
            `bash tests/guards.sh`, `bash tests/query/run.sh`, and
            `uv run --with-requirements scripts/requirements-checks.lock python scripts/check_metadata_schema.py`.
            Run git from the working directory, without `-C`.
            Run each command on its own: redirections (`>`), pipes, and
            other shell commands are not allowed. Read only the changed files
            and what they directly depend on; skip binary files such as PNG
            refs.

            Whether the default output changed is already checked by the
            required Test job, which compares every page against its ref
            PNG. Do not rebuild the main branch to compare renders yourself.
            When the allowlist refuses a command, do not retry the same goal
            with a different command; continue the review without it.

            Post each issue as soon as you confirm it, so nothing is lost if
            the run ends early.

            Use an inline comment for each issue:
            `mcp__github_inline_comment__create_inline_comment` (confirmed: true).
            Always finish with one top-level `gh pr comment` that summarizes
            the review, or says that you found no issues.
          # Show Claude's report in the job summary even if it posts nothing.
          # Safe here: the job skips fork PRs, so its input is trusted.
          display_report: true
          # The allowed checks run scripts from the PR branch. That is acceptable
          # because this job only runs for same-repository PRs, whose authors
          # have write access.
          # `best` resolves to the most capable model the installed Claude
          # Code knows (Fable, else Opus). The action pins Claude Code, and
          # Dependabot bumps the action weekly, so new models arrive without
          # editing this file.
          # The action checks --max-turns against the finished run, so a
          # review that ends after the limit still fails the job (90 turns
          # on #275). 80 leaves room for a large PR.
          claude_args: |
            --model best
            --max-turns 80
            --allowedTools "Read,Grep,Glob,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Write,Edit,Bash(typst compile:*),Bash(typst eval:*),Bash(typst --version),Bash(bash tests/panics/run.sh),Bash(bash tests/guards.sh),Bash(bash tests/query/run.sh),Bash(uv run --with-requirements scripts/requirements-checks.lock python scripts/check_metadata_schema.py)"

      # List every tool call and each call the allowlist refused, so a run
      # that runs out of turns shows where they went. Prints only the tool
      # name and its command or path, never tool output, so nothing
      # sensitive leaks into the public log.
      - name: List tool calls
        if: always() && steps.claude-review.outputs.execution_file != ''
        env:
          EXECUTION_FILE: ${{ steps.claude-review.outputs.execution_file }}
        run: |
          jq -r '(if type == "array" then .[] else . end)
            | select(.type == "assistant")
            | .message.content[]?
            | select(.type == "tool_use")
            | "call \(.name): \(.input.command // .input.file_path // .input.pattern // .input.path // "")"' \
            "$EXECUTION_FILE" || true
          jq -r '(if type == "array" then .[] else . end)
            | select(.type == "result")
            | .permission_denials[]?
            | "denied \(.tool_name): \(.tool_input.command // .tool_input.file_path // .tool_input.pattern // "")"' \
            "$EXECUTION_FILE" || true
