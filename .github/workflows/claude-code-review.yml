name: Claude Code Review

on:
  pull_request:
    # Review once when a PR opens or leaves draft. `synchronize` is intentionally
    # omitted so follow-up pushes don't re-run the review on every commit — tag
    # @claude manually if a later revision needs another pass.
    types: [opened, ready_for_review]
    # Only review changes to the published package and the user-facing template.
    # Docs-only / tests-only / CI-only PRs skip AI review, mirroring the repo
    # convention that such changes also skip regression tests.
    paths:
      - "src/**"
      - "template/**"

jobs:
  claude-review:
    # Fork PRs get no repository secrets, and the action refuses authors
    # without write access, so a run on a fork can only fail. Review
    # external contributions with an `@claude review` comment instead
    # (claude.yml), which runs in the base repository.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # post the review as PR comments
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@756cc22e19660d20e8cc9496b4f242475a7f7790 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          # Without --comment the plugin reviews and stops without posting.
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }} --comment'
          # Pin the model and cap iterations to keep review cost predictable.
          # 15 turns ran out on ordinary PRs (#258, #261) and failed the check.
          claude_args: '--model claude-sonnet-5 --max-turns 30'

